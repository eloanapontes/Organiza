upstream organiza_backend { server backend:3000; }
upstream organiza_frontend { server frontend:80; }

server {
  listen 80;
  server_name _;
  client_max_body_size 2m;

  location /api/ {
    proxy_pass http://organiza_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /health {
    proxy_pass http://organiza_backend/health;
    access_log off;
  }

  location / {
    proxy_pass http://organiza_frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
